<!doctype html>
<html lang="en" data-theme="mudcrab">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			(() => {
				try {
					let saved = localStorage.getItem('mudcrab-theme');
					if (saved === 'nordic-frost') saved = 'frost';
					if (saved === 'mudcrab' || saved === 'frost') {
						document.documentElement.setAttribute('data-theme', saved);
					}
				} catch {
					// Keep default theme when storage is unavailable
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-base-100 text-base-content antialiased">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
