<!doctype html>
<html lang="en" data-theme="mudcrab">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		<script>
			(() => {
				try {
					const saved = localStorage.getItem('mudcrab-theme');
					if (saved === 'mudcrab' || saved === 'nordic-frost') {
						document.documentElement.setAttribute('data-theme', saved);
					}
				} catch {
					// Keep default theme when storage is unavailable
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-base-100 text-base-content antialiased">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
